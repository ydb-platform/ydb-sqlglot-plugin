name: Nightly SQLGlot compatibility

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlglot-latest:
    name: Unit tests (latest pure-Python SQLGlot release)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install plugin with latest SQLGlot release
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --upgrade sqlglot

      - name: Show resolved SQLGlot build
        run: |
          python -c "import sqlglot, sqlglot.parser; print('sqlglot', sqlglot.__version__); print('parser', sqlglot.parser.__file__)"

      - name: Run unit tests
        run: pytest tests/unit/
