name: Nightly SQLGlot compatibility

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlglot-main:
    name: Unit tests (pure-Python sqlglot main)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install SQLGlot main and plugin
        run: |
          python -m pip install --upgrade pip
          pip install "sqlglot @ git+https://github.com/tobymao/sqlglot.git@main"
          pip install -e ".[dev]"

      - name: Show resolved SQLGlot build
        run: |
          python -c "import sqlglot, sqlglot.parser; print('sqlglot', sqlglot.__version__); print('parser', sqlglot.parser.__file__)"

      - name: Run unit tests
        run: pytest tests/unit/
